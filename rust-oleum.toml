# Code-quality gate configuration for rust-oleum
# (https://github.com/AgentWorkforce/rust-oleum).
#
# `[targets]` are the aspirational limits every metric is reported against.
# The `[baseline]` section grandfathers existing violations at their current
# ceiling so the CI gate can be enforced today: new violations, and
# regressions beyond a grandfathered ceiling, fail CI.
#
# Ratcheting (rust-oleum >= 0.2): run `rust-oleum --tighten` after improving
# the code — it rewrites `[baseline]` in place, dropping entries that now meet
# the target and lowering loose ceilings to today's values. It never
# grandfathers a new violation, so per-item ceilings only shrink and the
# `coverage_min_pct` floor only rises. `rust-oleum --write-baseline` instead
# prints a fresh section to stdout; it is only for adopting the gate, when a
# whole metric (e.g. panic/unsafe/suppression counts in the 0.2 line) starts
# being measured and everything it finds has to be grandfathered at once.

[targets]
cyclomatic_max = 22
cognitive_max = 22
halstead_difficulty_max = 80.0
file_loc_max = 500
coverage_min_pct = 100.0
crap_max = 25.0
surviving_mutants_max = 0
dead_code_max = 0
redundant_code_max = 0
# Safety and API-shape metrics (rust-oleum 0.2+). Zero is the target for every
# one of them; the counts that are not yet zero are grandfathered below.
unsafe_max = 0
panic_max = 0
bare_panic_max = 0
allow_max = 0
file_allow_max = 0
bare_allow_max = 0
file_bare_allow_max = 0
deny_warnings_max = 0
pub_wrapper_max = 0
get_prefix_max = 0
missing_error_impl_max = 0

[sources]
rust_roots = [
    "crates/relayburn-sdk/src",
    "crates/relayburn-cli/src",
    "crates/relayburn-sdk-node/src",
]

