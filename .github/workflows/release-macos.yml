name: Release (macOS app)

# Manual trigger: Actions tab → "Release (macOS app)" → Run workflow.
# Builds, signs, notarizes, and publishes the apps/macos menu bar app as a DMG.
# Uses a `macos-v*` tag scheme (and a moving `macos-latest` pointer) so it never
# touches burn's own `v*` CLI releases or their `latest` pointer.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute date-based version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          YEAR="$(date +%Y)"
          MONTH="$((10#$(date +%m)))"
          COUNT="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[].tag_name' | grep -Ec "^macos-v${YEAR}\.${MONTH}\." || true)"
          N="$((COUNT + 1))"
          VERSION="${YEAR}.${MONTH}.${N}"
          echo "Release #${N} for ${YEAR}-$(date +%m) -> macos-v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=macos-v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PREVIOUS_TAG="$(git tag --sort=-version:refname | grep -E '^macos-v[0-9]' | grep -v "^${TAG}$" | head -n 1 || true)"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          args=(-f "tag_name=${TAG}" -f "target_commitish=${GITHUB_SHA}")
          if [ -n "${PREVIOUS_TAG}" ]; then
            args+=(-f "previous_tag_name=${PREVIOUS_TAG}")
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            "${args[@]}" --jq ".body" > "${NOTES_FILE}"
          echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Decode App Store Connect API key (.p8)
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          mkdir -p "$HOME/private_keys"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$HOME/private_keys/AuthKey.p8"
          echo "APPLE_API_KEY=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          KCPW="$(uuidgen)"
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KCPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KCPW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KCPW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed s/\"//g)

      - name: Build, sign, notarize & package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for attempt in 1 2 3; do
            if ./release.sh; then exit 0; fi
            echo "release attempt ${attempt} failed; retrying in 60s..."
            sleep 60
          done
          echo "release failed after 3 attempts"
          exit 1

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          DMG="dist/BurnOSX-arm64.dmg"
          # The zip is the in-app updater's download artifact (AppUpdater reads
          # the releases feed and fetches BurnOSX-arm64.zip from the macos-v*
          # release it picks).
          ZIP="dist/BurnOSX-arm64.zip"
          # Versioned release (history). Not marked --latest: burn's own v* CLI
          # releases own the repo's "latest" pointer.
          gh release create "${TAG}" "${DMG}" "${ZIP}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Burn for Mac ${{ steps.version.outputs.version }}" \
            --notes-file "${{ steps.changelog.outputs.notes_file }}"
          # Moving pointer for a stable download URL:
          #   releases/download/macos-latest/BurnOSX-arm64.dmg
          # Preserve the live pointer until its replacement artifacts exist.
          # Only a verified 404 permits creation; auth, rate-limit, and other
          # probe failures stop the workflow instead of masquerading as absence.
          RELEASE_PROBE="${RUNNER_TEMP}/macos-latest-release.txt"
          RELEASE_PROBE_ERROR="${RUNNER_TEMP}/macos-latest-release-error.txt"
          if gh api --include \
            "repos/${GITHUB_REPOSITORY}/releases/tags/macos-latest" \
            > "${RELEASE_PROBE}" 2> "${RELEASE_PROBE_ERROR}"; then
            BACKUP_DIR="${RUNNER_TEMP}/macos-latest-backup"
            BACKUP_DMG="${BACKUP_DIR}/$(basename "${DMG}")"
            BACKUP_ZIP="${BACKUP_DIR}/$(basename "${ZIP}")"
            mkdir -p "${BACKUP_DIR}"
            gh release download macos-latest \
              --repo "${GITHUB_REPOSITORY}" \
              --dir "${BACKUP_DIR}" \
              --pattern "$(basename "${DMG}")" \
              --pattern "$(basename "${ZIP}")"
            test -s "${BACKUP_DMG}"
            test -s "${BACKUP_ZIP}"

            upload_succeeded=false
            for attempt in 1 2 3; do
              if gh release upload macos-latest "${DMG}" "${ZIP}" \
                --repo "${GITHUB_REPOSITORY}" \
                --clobber; then
                upload_succeeded=true
                break
              fi
              echo "macos-latest replacement upload attempt ${attempt} failed"
            done
            if [ "${upload_succeeded}" != true ]; then
              echo "replacement failed; restoring the previously downloaded assets" >&2
              restore_succeeded=false
              for attempt in 1 2 3; do
                if gh release upload macos-latest "${BACKUP_DMG}" "${BACKUP_ZIP}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --clobber; then
                  restore_succeeded=true
                  break
                fi
                echo "macos-latest rollback attempt ${attempt} failed" >&2
              done
              if [ "${restore_succeeded}" != true ]; then
                echo "macos-latest rollback failed; prior assets remain in ${BACKUP_DIR}" >&2
              fi
              exit 1
            fi

            gh release edit macos-latest \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Burn for Mac (latest)" \
              --notes "Latest macOS app build — points at ${TAG}."
            # `release edit --target` updates release metadata but does not move
            # an existing Git tag. Retarget the lightweight tag in place only
            # after the replacement assets are live.
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/macos-latest" \
              -F "sha=${GITHUB_SHA}" \
              -F force=true \
              --silent
          elif grep -Eq '^HTTP/[0-9.]+ 404 ' "${RELEASE_PROBE}"; then
            gh release create macos-latest "${DMG}" "${ZIP}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Burn for Mac (latest)" \
              --notes "Latest macOS app build — points at ${TAG}."
          else
            cat "${RELEASE_PROBE_ERROR}" >&2
            exit 1
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentlimit-macos-${{ github.run_id }}
          path: |
            apps/macos/dist/*.dmg
            apps/macos/dist/*.zip
          if-no-files-found: warn
          retention-days: 30
