name: Quality

# Code-quality gate: rust-oleum (https://github.com/AgentWorkforce/rust-oleum)
# measures cyclomatic / cognitive complexity, Halstead difficulty, file
# size, test coverage, CRAP, and dead + redundant code against the targets
# and grandfathered baseline in rust-oleum.toml. A second PR-only job runs
# mutation testing over the PR diff.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Pinned so the cached ~/.cargo/bin copy is used only while it is this
  # version; bumping the pin forces a reinstall through the cache.
  RUST_OLEUM_VERSION: 0.1.1

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        # rust-toolchain.toml pins the channel; install unconditionally so a
        # stale preinstalled stable is upgraded (same rationale as ci.yml).
        run: |
          rustup toolchain install
          rustup component add clippy llvm-tools-preview

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Separate key namespace from ci.yml and from mutation-diff: the
          # instrumented llvm-cov target artifacts must not be restored
          # into the plain CI build, and two jobs saving one key race so
          # only one save lands.
          key: quality-benchmark-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            quality-benchmark-cargo-${{ runner.os }}-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Install rust-oleum
        # The cache keeps ~/.cargo/bin but not cargo's install metadata
        # (~/.cargo/.crates2.json), so a plain `cargo install` refuses with
        # "binary already exists". Skip when the cached binary is already
        # the pinned version; force-reinstall over it otherwise.
        run: |
          if [ "$(rust-oleum --version 2>/dev/null)" != "rust-oleum $RUST_OLEUM_VERSION" ]; then
            cargo install --locked --force rust-oleum --version "$RUST_OLEUM_VERSION"
          fi

      - name: Measure test coverage
        # relayburn-sdk-node is exercised by the Node test suite (ci.yml),
        # not `cargo test`, so it is excluded from the coverage denominator.
        env:
          BURN_GOLDEN: '1'
        run: >
          cargo llvm-cov --workspace --exclude relayburn-sdk-node
          --lcov --output-path lcov.info

      - name: Collect clippy diagnostics
        run: cargo clippy --workspace --all-targets --message-format=json > clippy-log.json

      - name: Run quality gate
        run: >
          rust-oleum
          --coverage lcov.info
          --clippy-log clippy-log.json
          --json quality-report.json
          --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: |
            quality-report.json
            lcov.info
          if-no-files-found: ignore

  mutation-diff:
    # Mutation testing over the whole workspace takes hours, so PRs are gated
    # on "no surviving mutants in the lines this PR touches" instead. The
    # full-suite number stays a target, not a per-PR gate.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history: the PR diff below needs the merge base with the
          # base branch, which a depth-1 checkout doesn't contain.
          fetch-depth: 0

      - name: Setup Rust toolchain
        run: rustup toolchain install

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: quality-mutants-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            quality-mutants-cargo-${{ runner.os }}-

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Install rust-oleum
        # The cache keeps ~/.cargo/bin but not cargo's install metadata
        # (~/.cargo/.crates2.json), so a plain `cargo install` refuses with
        # "binary already exists". Skip when the cached binary is already
        # the pinned version; force-reinstall over it otherwise.
        run: |
          if [ "$(rust-oleum --version 2>/dev/null)" != "rust-oleum $RUST_OLEUM_VERSION" ]; then
            cargo install --locked --force rust-oleum --version "$RUST_OLEUM_VERSION"
          fi

      - name: Compute PR diff
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff "origin/${{ github.base_ref }}"... > pr.diff
          wc -l pr.diff

      - name: Run mutation testing on the diff
        env:
          BURN_GOLDEN: '1'
        # Exit 2 = surviving mutants (gated by the step below, with a
        # report). Exit 3 = timeouts only, which rust-oleum reports but
        # does not gate. Anything else fails the job — notably 4, which
        # means the unmutated tree's tests are already failing. A
        # docs-only diff exits 0.
        run: |
          set +e
          cargo mutants --no-shuffle --in-diff pr.diff
          ec=$?
          if [ "$ec" -ne 0 ] && [ "$ec" -ne 2 ] && [ "$ec" -ne 3 ]; then
            exit "$ec"
          fi

      - name: Run quality gate on mutants
        run: |
          if [ -f mutants.out/outcomes.json ]; then
            rust-oleum \
              --mutants mutants.out/outcomes.json \
              --github-summary "$GITHUB_STEP_SUMMARY"
          else
            echo "No mutants generated for this diff."
          fi

      - name: Upload mutants output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-out
          path: mutants.out
          if-no-files-found: ignore
