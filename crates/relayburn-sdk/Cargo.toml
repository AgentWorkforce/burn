[package]
name = "relayburn-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Embedding API for relayburn — published to crates.io as the supported Rust surface."

[dependencies]
# Common
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
uuid = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

# reader: hashing + classifier rule tables
sha2 = "0.10"
hex = "0.4"
regex = "1"
phf = { version = "0.11", features = ["macros"] }
# ledger: SQLite events + content store
rusqlite = { workspace = true }

# Session sourcing: relayhistory captures harness evidence; burn owns what
# the counters mean. burn depends on a semver-compatible ai-hist release;
# adopting a new minor is a deliberate bump that re-runs the parity suite.
ai-hist = "0.45"
# Path-mode session analysis stages one transcript into a throwaway
# provider root and relayhistory store.
tempfile = "3"

# ingest + query_verbs: civil-date arithmetic / ISO-8601 formatting.
# Replaces three hand-rolled Howard Hinnant implementations.
time = { version = "0.3", default-features = false, features = ["formatting", "parsing", "macros"] }

# analyze: order-preserving pricing table.
# `IndexMap` preserves JSON insertion order so duplicate model IDs in
# `models.dev.json` (e.g. `claude-sonnet-4-6` under both `anthropic` and
# `nano-gpt`) resolve deterministically — last entry in file order wins,
# matching the TS `Object.values` / `Object.entries` iteration semantics.
indexmap = { version = "2", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
# ingest: pid-liveness probe in the pending-stamp resolver
libc = "0.2"

[dev-dependencies]
# Seals the test process away from the real ai-hist store, ledger and
# harness data; see crates/relayburn-test-seal.
relayburn-test-seal = { path = "../relayburn-test-seal" }
